const b=s=>{const t=atob(s),u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u};
async function open_(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  let pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},k,b(D.c));
  if(D.z)pt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  return new TextDecoder().decode(pt);
}
function show(h){document.open();document.write(h);document.close()}
async function tryPw(pw,quiet){
  const m=document.getElementById('e');if(!quiet)m.textContent='Opening...';
  try{const h=await open_(pw);try{localStorage.setItem('oche_pw',pw)}catch(e){};show(h);return true}
  catch(e){if(!quiet)m.textContent='Wrong password';return false}
}
(async()=>{
  let pw=null;
  if(location.hash.startsWith('#pw=')){pw=decodeURIComponent(location.hash.slice(4));history.replaceState(null,'',location.pathname)}
  else{try{pw=localStorage.getItem('oche_pw')}catch(e){}}
  if(pw)await tryPw(pw,true);
})();
document.getElementById('f').onsubmit=e=>{e.preventDefault();tryPw(document.getElementById('p').value,false)};
})();
